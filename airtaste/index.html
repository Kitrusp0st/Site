<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AirTaste</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#20251f;font:16px system-ui}main{max-width:580px;margin:auto;padding:24px 18px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;letter-spacing:-2px;margin:0}small{color:#68736a}button,input{font:inherit;border:0;border-radius:16px;padding:13px}button{cursor:pointer;background:#e6e9df;color:#203728}input{width:100%;background:white;margin:18px 0 10px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.active{background:#244c37;color:white}article{background:white;border-radius:28px;overflow:hidden;box-shadow:0 12px 40px #27392112}.hero{height:180px;display:grid;place-items:center;font-size:90px;background:#e5ebd9}.content{padding:22px}h2{margin:8px 0;font-size:28px;letter-spacing:-1px}.meta{display:flex;gap:12px;color:#49604d;font-weight:600}.actions{display:flex;justify-content:center;gap:16px;margin:18px}.actions button{font-size:25px;width:72px;height:60px}.like{background:#244c37;color:white}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;gap:10px;padding:12px}p,li{line-height:1.55}details{margin-top:18px}summary{cursor:pointer;font-weight:600}.empty{padding:30px;text-align:center}</style><main><header><div><small>ТВОЯ КУХНЯ · АЭРОГРИЛЬ</small><h1>AirTaste<span style="color:#65965a">.</span></h1></div><button onclick="mode='saved';render()">♡ <span id="count">0</span></button></header><input id="search" placeholder="Поиск блюда или ингредиента" oninput="i=0;render()"><nav id="cats"></nav><div id="out"></div></main><footer><button onclick="mode='discover';render()">◈ Подборка</button><button onclick="mode='all';render()">▦ Каталог</button><button onclick="mode='saved';render()">♡ Избранное</button></footer><script>const R=[['Хрустящий картофель','🥔','Гарниры',190,20,'картофель, масло, паприка, соль','Нарежь картофель дольками. Перемешай с маслом и специями. Готовь, встряхнув корзину в середине.'],['Куриные стрипсы','🍗','Мясо',190,15,'куриное филе, яйцо, сухари, соль','Нарежь филе полосками. Обмакни в яйцо и сухари. Готовь до 74°C внутри, перевернув в середине.'],['Горячие бутерброды','🥪','Завтрак',180,6,'хлеб, сыр, ветчина','Собери бутерброды, закрепи лёгкие ингредиенты и запекай до расплавления сыра.'],['Сырники','🥞','Завтрак',180,12,'творог, яйцо, мука, сахар','Смешай ингредиенты, сформируй сырники и выложи на подходящий перфорированный коврик. Переверни в середине.'],['Шампиньоны с чесноком','🍄','Гарниры',185,12,'шампиньоны, чеснок, масло, соль','Перемешай грибы с маслом и чесноком. Готовь до мягкости, встряхивая корзину.'],['Яблоки с корицей','🍎','Десерты',175,12,'яблоки, корица, сахар','Разрежь яблоки, удали сердцевину, посыпь корицей. Запекай до мягкости.'],['Мини-пицца','🍕','Завтрак',180,8,'лаваш, томатный соус, сыр, салями','Намажь основу соусом, добавь начинку и запекай до расплавления сыра.'],['Куриные крылышки','🍗','Мясо',190,25,'крылышки, паприка, чеснок, масло','Приправь крылышки, выложи одним слоем. Переверни в середине, проверь 74°C внутри.'],['Овощи гриль','🥦','Гарниры',185,15,'брокколи, перец, кабачок, масло','Нарежь овощи, перемешай с маслом. Готовь до мягкости, встряхивая корзину.'],['Банановый десерт','🍌','Десерты',170,8,'банан, шоколад','Разрежь банан вдоль, добавь шоколад в жаропрочной форме. Запекай до мягкости.']];let saved=JSON.parse(localStorage.getItem('airtaste')||'[]'),mode='discover',cat='Все',i=0;function toggle(n){saved=saved.includes(n)?saved.filter(x=>x!==n):[...saved,n];localStorage.setItem('airtaste',JSON.stringify(saved));render()}function next(l){let a=filtered();if(l&&a.length){let n=a[i%a.length];if(!saved.includes(n))saved.push(n);localStorage.setItem('airtaste',JSON.stringify(saved))}i++;render()}function filtered(){let q=document.querySelector('#search').value.toLowerCase();return R.map((r,n)=>n).filter(n=>(cat==='Все'||R[n][2]===cat)&&R[n].join(' ').toLowerCase().includes(q)&&(mode!=='saved'||saved.includes(n)))}function card(n){let r=R[n];return `<article><div class="hero">${r[1]}</div><div class="content"><small>${r[2]}</small><h2>${r[0]}</h2><div class="meta">🌡 ${r[3]}°C · ◷ ${r[4]} мин</div><p>${r[5]}</p><details><summary>Как приготовить</summary><p>${r[6]}</p><small>Время ориентировочное, зависит от модели и размера порции.</small></details><button style="margin-top:15px" onclick="toggle(${n})">${saved.includes(n)?'♥ Сохранено':'♡ Сохранить'}</button></div></article>`}function render(){document.querySelector('#count').textContent=saved.length;document.querySelector('#cats').innerHTML=['Все','Мясо','Гарниры','Завтрак','Десерты'].map(c=>`<button class="${cat===c?'active':''}" onclick="cat='${c}';i=0;render()">${c}</button>`).join('');let a=filtered();document.querySelector('#out').innerHTML=!a.length?'<div class="empty">Нет подходящих рецептов</div>':mode==='discover'?card(a[i%a.length])+'<div class="actions"><button onclick="next(false)">✕</button><button class="like" onclick="next(true)">♥</button></div>':a.map(n=>card(n)).join('<br>');}let x=0;document.addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(mode==='discover'&&Math.abs(d)>90)next(d>0)},{passive:true});render()</script></html>
